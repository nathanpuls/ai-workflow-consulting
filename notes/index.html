<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes</title>

  <style>
    body {
  margin: 0;
  background: #ffffff;
  color: #111827;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif,
    Inter;
  line-height: 1.7;
}

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 24px;
    }

    .copy-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      border-radius: 999px;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
      z-index: 10;
    }

    .copy-btn:hover {
      background: #f9fafb;
    }

    .note-line {
      margin: 0 0 14px;
      font-size: 17px;
      white-space: pre-wrap;
    }

    .empty {
      color: #6b7280;
    }
  </style>
</head>

<body>
  <button class="copy-btn" id="copyBtn" title="Copy notes">⧉</button>

  <main>
    <div id="notes"></div>
  </main>

  <script>
    const SHEET_ID = "1ovUgHEIgJkKQKr8q2Q_g0FX9cRo2rG_OznN-X4xjlTY";
    const SHEET_NAME = "Sheet1";

    const GVIZ_URL =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

    const notesEl = document.getElementById("notes");
    const copyBtn = document.getElementById("copyBtn");

    let plainText = "";

    function parseGvizResponse(text) {
      const jsonText = text.substring(
        text.indexOf("{"),
        text.lastIndexOf("}") + 1
      );

      return JSON.parse(jsonText);
    }

    function renderNotes(lines) {
      notesEl.innerHTML = "";

      if (!lines.length) {
        notesEl.innerHTML = '<p class="empty">No notes yet.</p>';
        plainText = "";
        return;
      }

      lines.forEach(line => {
        const p = document.createElement("p");
        p.className = "note-line";
        p.textContent = line;
        notesEl.appendChild(p);
      });

      plainText = lines.join("\n");
    }

    async function loadNotes() {
      try {
        const res = await fetch(GVIZ_URL);
        const text = await res.text();
        const data = parseGvizResponse(text);

        const rows = data.table.rows || [];

        const lines = rows
          .map(row => row.c?.[0]?.v)
          .filter(value => value !== null && value !== undefined && String(value).trim() !== "")
          .map(value => String(value).trim());

        renderNotes(lines);
      } catch (err) {
        notesEl.innerHTML = '<p class="empty">Could not load notes.</p>';
      }
    }

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(plainText);
        copyBtn.textContent = "✓";

        setTimeout(() => {
          copyBtn.textContent = "⧉";
        }, 1200);
      } catch (err) {
        copyBtn.textContent = "!";
      }
    });

    loadNotes();
  </script>
</body>
</html>
